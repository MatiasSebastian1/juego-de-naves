<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabal HD</title>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
  canvas{display:block;cursor:none;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* ============================================================
   CABAL HD  -  shooter arcade 2D al estilo Cabal, dibujado en HD
   Controles: WASD/Flechas mover - Mouse apuntar - Click disparar
              Click derecho / G granada - Espacio esquivar - P pausa
   ============================================================ */

const W = 1280, H = 720, HOR = 292, FLOOR = 650;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  scale = Math.min(w / W, h / H);
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  ox = (w - W * scale) / 2; oy = (h - H * scale) / 2;
}
addEventListener('resize', resize); resize();

/* ---------- utilidades ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const zscale = z => 0.28 + z * 0.85;
const zy = z => HOR + z * (FLOOR - HOR);
function mulberry(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function glow(g, x, y, r, color, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color.replace('A', a)); gr.addColorStop(1, color.replace('A', 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}

/* ---------- audio sintetizado ---------- */
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, f0, f1, vol, type = 'lowpass') {
  if (!AC) return; const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
function tone(f0, f1, dur, vol, type = 'square', delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
}
const sfx = {
  shot() { noise(0.07, 4000, 900, 0.22, 'highpass'); tone(190, 60, 0.07, 0.16); },
  spread() { noise(0.16, 3000, 400, 0.4, 'highpass'); tone(120, 40, 0.14, 0.25); },
  hit() { tone(520, 300, 0.04, 0.08); },
  head() { tone(900, 500, 0.08, 0.14, 'triangle'); },
  boom() { noise(0.8, 2000, 50, 0.9); tone(90, 28, 0.55, 0.5, 'sine'); },
  hurt() { tone(220, 70, 0.3, 0.4, 'sawtooth'); noise(0.2, 800, 100, 0.4); },
  roll() { noise(0.22, 600, 2500, 0.18, 'bandpass'); },
  pickup() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.09, 0.14, 'triangle', i * 0.06)); },
  enemy() { tone(300, 140, 0.12, 0.07, 'sawtooth'); },
  nade() { tone(700, 300, 0.2, 0.1, 'triangle'); },
  wave() { [392, 523, 659].forEach((f, i) => tone(f, f, 0.18, 0.12, 'triangle', i * 0.12)); },
  over() { [330, 262, 196, 131].forEach((f, i) => tone(f, f * 0.9, 0.35, 0.2, 'sawtooth', i * 0.25)); },
};

/* ---------- utilidades de arte (todo determinista: semilla fija, sin Math.random) ---------- */
const hx = c => { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
function mixc(a, b, t) { const A = hx(a), B = hx(b); return '#' + [0, 1, 2].map(i => Math.round(lerp(A[i], B[i], t)).toString(16).padStart(2, '0')).join(''); }
function ca(c, a) { const v = hx(c); return `rgba(${v[0]},${v[1]},${v[2]},${a})`; }
let _TX = null; const _PC = new WeakMap();
function TX() { // texturas pequenas teselables (tela, grano, camuflaje, chapa, hormigon, madera)
  if (_TX) return _TX;
  const R = mulberry(4242);
  const mk = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };
  const wrap = (g, w, h, x, y, f) => { for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { g.save(); g.translate(x + i * w, y + j * h); f(); g.restore(); } };
  _TX = {
    weave: mk(8, 8, g => { g.lineWidth = 1; for (let k = -2; k < 5; k++) {
      g.strokeStyle = 'rgba(0,0,0,.34)'; g.beginPath(); g.moveTo(k * 4, 8); g.lineTo(k * 4 + 8, 0); g.stroke();
      g.strokeStyle = 'rgba(255,225,180,.10)'; g.beginPath(); g.moveTo(k * 4 + 2, 8); g.lineTo(k * 4 + 10, 0); g.stroke(); } }),
    grain: mk(64, 64, g => { for (let i = 0; i < 700; i++) { g.fillStyle = R() < .5 ? `rgba(0,0,0,${.1 + R() * .25})` : `rgba(255,235,200,${R() * .12})`; g.fillRect(R() * 64, R() * 64, 1 + (R() * 2 | 0), 1 + (R() * 2 | 0)); } }),
    camo: mk(128, 128, g => { for (let i = 0; i < 18; i++) { const x = R() * 128, y = R() * 128, rx = 8 + R() * 18, ry = 5 + R() * 11, rot = R() * 3, dark = R() < .6;
      wrap(g, 128, 128, x, y, () => { g.rotate(rot); g.fillStyle = dark ? 'rgba(0,0,0,.30)' : 'rgba(255,240,190,.13)'; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.fill(); }); } }),
    plate: mk(12, 12, g => { g.fillStyle = 'rgba(255,255,255,.17)'; g.beginPath(); g.moveTo(6, 1); g.lineTo(9.5, 6); g.lineTo(6, 11); g.lineTo(2.5, 6); g.fill();
      g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.moveTo(6, 3); g.lineTo(8, 6); g.lineTo(6, 9); g.lineTo(4, 6); g.fill(); }),
    concrete: mk(128, 128, g => {
      for (let i = 0; i < 26; i++) { wrap(g, 128, 128, R() * 128, R() * 128, () => { const r = 6 + R() * 16; const gr = g.createRadialGradient(0, 0, 0, 0, 0, r); const d = R() < .5; gr.addColorStop(0, d ? 'rgba(0,0,0,.14)' : 'rgba(255,235,205,.10)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); }); }
      for (let i = 0; i < 520; i++) { g.fillStyle = R() < .6 ? `rgba(0,0,0,${.12 + R() * .22})` : `rgba(255,240,215,${.06 + R() * .14})`; const s = R() < .15 ? 2 : 1; g.fillRect(R() * 128, R() * 128, s, s); }
      for (let i = 0; i < 40; i++) { g.fillStyle = R() < .5 ? 'rgba(30,24,22,.35)' : 'rgba(210,195,175,.22)'; g.beginPath(); g.arc(R() * 128, R() * 128, .8 + R() * 1.6, 0, 7); g.fill(); } }),
  };
  return _TX;
}
function tfill(g, name, sc, a, x, y, w, h) {
  let m = _PC.get(g); if (!m) { m = {}; _PC.set(g, m); }
  const p = m[name] || (m[name] = g.createPattern(TX()[name], 'repeat'));
  p.setTransform(new DOMMatrix().scale(sc));
  g.save(); g.globalAlpha *= a; g.fillStyle = p; g.fillRect(x, y, w, h); g.restore();
}
/* pieza con volumen: luz calida de atardecer desde la derecha, sombra fria a la izquierda.
   x,y,w,h,r en unidades (se multiplican por u). o: {F,tex,ta,metal,rim,lw} */
function vol(g, u, x, y, w, h, r, base, o = {}) {
  x *= u; y *= u; w *= u; h *= u; r *= u;
  if (o.F) { g.fillStyle = '#fff'; rr(g, x, y, w, h, r); g.fill(); g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1.3; g.stroke(); return; }
  const cool = '#1a1030', gr = g.createLinearGradient(x, 0, x + w, 0);
  if (o.metal) {
    gr.addColorStop(0, mixc(base, cool, .62)); gr.addColorStop(.3, mixc(base, cool, .22)); gr.addColorStop(.6, base);
    gr.addColorStop(.8, mixc(base, '#ffe3c0', .38)); gr.addColorStop(.9, mixc(base, '#ffb070', .12)); gr.addColorStop(1, mixc(base, '#ffb878', .5));
  } else {
    gr.addColorStop(0, mixc(base, cool, .52)); gr.addColorStop(.38, mixc(base, cool, .14)); gr.addColorStop(.74, base); gr.addColorStop(1, mixc(base, '#ffb878', .46));
  }
  g.fillStyle = gr; rr(g, x, y, w, h, r); g.fill();
  g.save(); g.clip();
  if (o.tex) tfill(g, o.tex, u / 2.6 * (o.ts || 1), o.ta || .5, x, y, w, h);
  const vg = g.createLinearGradient(0, y, 0, y + h);
  vg.addColorStop(0, 'rgba(255,190,130,.12)'); vg.addColorStop(.45, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,4,16,.40)');
  g.fillStyle = vg; g.fillRect(x, y, w, h);
  const rg = g.createLinearGradient(x + w * .76, 0, x + w, 0); rg.addColorStop(0, 'rgba(255,170,90,0)'); rg.addColorStop(1, 'rgba(255,200,125,.5)');
  g.fillStyle = rg; g.fillRect(x + w * .76, y, w * .24, h);
  g.restore();
  g.strokeStyle = 'rgba(14,8,18,.72)'; g.lineWidth = o.lw || 1.3; g.stroke();
  if (o.rim !== false && w > 3 * u) { g.strokeStyle = 'rgba(255,200,130,.5)'; g.lineWidth = 1.1; g.beginPath(); g.moveTo(x + w - .6, y + r * .9); g.lineTo(x + w - .6, y + h - r * .9); g.stroke(); }
}
function rivet(g, x, y, r, F) { // remache con brillo
  if (F) return;
  const gr = g.createRadialGradient(x - r * .35, y - r * .35, 0, x, y, r); gr.addColorStop(0, '#d9dbe2'); gr.addColorStop(.5, '#6d7280'); gr.addColorStop(1, '#1b1d26');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,200,130,.5)'; g.beginPath(); g.arc(x + r * .35, y - r * .3, r * .28, 0, 7); g.fill();
}
function pipe(g, x1, y1, cx, cy, x2, y2, wd, base) { // tuberia cilindrica
  g.save(); g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(cx, cy, x2, y2);
  g.strokeStyle = 'rgba(8,6,12,.85)'; g.lineWidth = wd + 2.4; g.stroke();
  g.strokeStyle = mixc(base, '#10101a', .35); g.lineWidth = wd; g.stroke();
  g.strokeStyle = mixc(base, '#ffffff', .25); g.lineWidth = wd * .45; g.save(); g.translate(wd * .14, -wd * .1); g.stroke(); g.restore();
  g.strokeStyle = 'rgba(255,200,130,.5)'; g.lineWidth = wd * .15; g.save(); g.translate(wd * .3, -wd * .12); g.stroke(); g.restore();
  g.restore();
}
function hazard(g, x, y, w, h, F) { // franja amarilla/negra
  if (F) return;
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = '#c99a1c'; g.fillRect(x, y, w, h); g.fillStyle = '#17120d';
  const s = h * 1.1; for (let i = -2; i < w / s + 3; i++) { g.beginPath(); g.moveTo(x + i * s, y + h); g.lineTo(x + i * s + s * .5, y + h); g.lineTo(x + i * s + s * .5 + h, y); g.lineTo(x + i * s + h, y); g.fill(); }
  const sh = g.createLinearGradient(x, 0, x + w, 0); sh.addColorStop(0, 'rgba(10,4,20,.5)'); sh.addColorStop(.7, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(255,170,90,.3)');
  g.fillStyle = sh; g.fillRect(x, y, w, h); g.restore();
  g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1; g.strokeRect(x, y, w, h);
}

/* cache de sprites: el arte detallado se dibuja una vez por pose y luego se reutiliza (rendimiento) */
const _SPR = new Map();
function sprite(g, key, w, h, fn, maxCs = 2) {
  const tm = g.getTransform(), cs = clamp(Math.ceil(Math.hypot(tm.a, tm.b) * 4 - 1e-6) / 4, 1, maxCs), k = key + '@' + cs;
  let c = _SPR.get(k);
  if (!c) { c = document.createElement('canvas'); c.width = Math.ceil(w * cs); c.height = Math.ceil(h * cs); const gg = c.getContext('2d'); gg.scale(cs, cs); fn(gg); _SPR.set(k, c); }
  return c;
}

/* ---------- fondo pre-renderizado en 2x (HD) ---------- */
const bg = document.createElement('canvas'); bg.width = W * 2; bg.height = H * 2;
function ruinBuilding(g, R, x, w, h, L) {
  const base = HOR + 8, top = base - h, n = 3 + (R() * 4 | 0), tops = [];
  for (let s = 0; s <= n; s++) tops.push(top + (R() < .4 ? R() * L.dmg : R() * 5));
  if (R() < .55) { const k = R() < .5 ? 0 : n; tops[k] += L.dmg * (.8 + R()); tops[k ? k - 1 : 1] += L.dmg * .5; }
  const roofAt = px => { const f = clamp((px - x) / w, 0, .9999) * n, i = f | 0; return lerp(tops[i], tops[i + 1], f - i); };
  const gr = g.createLinearGradient(0, top, 0, base);
  gr.addColorStop(0, mixc(L.col, '#ff9a6a', L.lit)); gr.addColorStop(1, L.col);
  g.fillStyle = gr; g.beginPath(); g.moveTo(x, base); for (let s = 0; s <= n; s++) g.lineTo(x + w * s / n, tops[s]); g.lineTo(x + w, base); g.closePath(); g.fill();
  if (L.det >= 1) {
    g.save(); g.clip();
    const rg = g.createLinearGradient(x + w - 7, 0, x + w, 0); rg.addColorStop(0, 'rgba(255,170,100,0)'); rg.addColorStop(1, `rgba(255,185,120,${.16 + L.det * .07})`);
    g.fillStyle = rg; g.fillRect(x + w - 7, top - 60, 7, h + 80);
    const lg = g.createLinearGradient(x, 0, x + w * .5, 0); lg.addColorStop(0, 'rgba(8,4,16,.35)'); lg.addColorStop(1, 'rgba(8,4,16,0)'); g.fillStyle = lg; g.fillRect(x, top - 60, w * .5, h + 80);
    if (L.det >= 2) tfill(g, 'concrete', .5, .55, x, top - 60, w, h + 80);
    g.restore();
  }
  if (L.det >= 2) { g.strokeStyle = 'rgba(255,175,110,.22)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, tops[0]); for (let s = 1; s <= n; s++) g.lineTo(x + w * s / n, tops[s]); g.stroke(); }
  let hole = null;
  if (L.det >= 2 && R() < L.hole) {
    const hw = w * (.3 + R() * .3), hxx = x + R() * (w - hw), hy = Math.max(...tops) + 8 + R() * h * .25, hh = Math.min(28 + R() * 40, base - hy - 28);
    if (hh > 18) {
      hole = { x: hxx, y: hy, w: hw, h: hh };
      g.fillStyle = 'rgba(6,3,10,.74)'; g.fillRect(hxx, hy, hw, hh);
      g.fillStyle = 'rgba(150,90,90,.3)'; for (let yy = hy + 12; yy < hy + hh; yy += 13) g.fillRect(hxx, yy, hw, 1.6);
      g.fillStyle = 'rgba(30,18,30,.8)'; for (let xx = hxx + 8; xx < hxx + hw - 3; xx += 15 + R() * 8) g.fillRect(xx, hy, 2.4, hh);
      g.strokeStyle = 'rgba(255,170,100,.3)'; g.lineWidth = 1; g.beginPath(); g.moveTo(hxx + hw, hy); g.lineTo(hxx + hw, hy + hh); g.stroke();
      g.strokeStyle = '#0b0710'; g.lineWidth = 2; g.beginPath(); const bx = hxx + R() * hw; g.moveTo(bx, hy + hh); g.lineTo(bx + 6 + R() * 12, hy + hh + 6 + R() * 8); g.stroke();
    }
  }
  if (L.win > 0 || L.det >= 1) {
    const sp = 11 + L.det * .5;
    for (let wy = top + 16; wy < base - 8; wy += sp + 4) for (let wx = x + 5; wx < x + w - 7; wx += sp) {
      if (wy < roofAt(wx) + 5) continue; if (hole && wx > hole.x - 6 && wx < hole.x + hole.w && wy > hole.y - 8 && wy < hole.y + hole.h) continue;
      const q = R();
      if (q < L.win * .45) { g.fillStyle = `rgba(255,${170 + R() * 60 | 0},90,${.35 + R() * .5})`; g.fillRect(wx, wy, 5, 7); }
      else if (q < .72) { g.fillStyle = 'rgba(8,4,14,.5)'; g.fillRect(wx, wy, 5, 7); if (L.det >= 3) { g.fillStyle = 'rgba(255,170,100,.25)'; g.fillRect(wx + 4, wy, 1, 7); } }
    }
  }
  if (L.det >= 2) {
    const nb = 1 + (R() * 3 | 0);
    for (let b = 0; b < nb; b++) {
      const px = x + 4 + R() * (w - 8), ry = roofAt(px);
      g.strokeStyle = '#0b0710'; g.lineWidth = 1;
      for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(px + k * 2, ry + 2); g.lineTo(px + k * 2 + (R() - .5) * 6, ry - 8 - R() * 20); g.stroke(); }
      if (R() < .65) { const dir = R() < .5 ? -1 : 1, len = 14 + R() * 28, dy = R() * 10;
        g.lineWidth = 2.8; g.beginPath(); g.moveTo(px, ry + 4); g.lineTo(px + dir * len, ry + 4 + dy); g.stroke();
        g.strokeStyle = 'rgba(255,170,100,.4)'; g.lineWidth = .9; g.beginPath(); g.moveTo(px, ry + 3); g.lineTo(px + dir * len, ry + 3 + dy); g.stroke(); }
    }
  }
}
function bgSmoke(g, px, py, hgt, drift, a, dark) {
  for (let i = 0; i < 22; i++) {
    const p = i / 22, y = py - p * hgt, x = px + p * drift + Math.sin(p * 7 + px) * 7, r = 7 + p * 40, al = a * Math.pow(1 - p, .9);
    g.fillStyle = `rgba(255,150,100,${al * .45})`; g.beginPath(); g.arc(x + r * .28, y - r * .12, r, 0, 7); g.fill();
    g.fillStyle = ca(dark, al); g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
}
/* drawBackground(layer): 'all' (por defecto) pinta todo en `bg` igual que siempre. 'sky' | 'far' | 'mid' | 'ground' devuelve un canvas 2x
   con solo esa capa (transparente donde no hay nada) y 'layers' devuelve las cuatro {sky,far,mid,ground}. La secuencia aleatoria es la
   misma en todos los modos (se dibuja todo, solo cambia a que canvas va cada tramo), asi apiladas reproducen 'all'. */
function drawBackground(layer = 'all') {
  const all = layer === 'all', names = ['sky', 'far', 'mid', 'ground'], CV = {};
  if (all) { const x = bg.getContext('2d'); x.scale(2, 2); names.forEach(n => CV[n] = x); }
  else names.forEach(n => { const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2; const x = c.getContext('2d'); x.scale(2, 2); CV[n] = x; });
  let g = CV.sky; const use = n => { g = CV[n]; };
  const R = mulberry(7), SUN = { x: 900, y: HOR - 40 }, FIRES = [140, 430, 720, 1040, 1210];
  const T = Math.PI * 2;
  // ----- cielo
  let gr = g.createLinearGradient(0, 0, 0, HOR + 30);
  [[0, '#090719'], [.18, '#1b1040'], [.4, '#4a2557'], [.6, '#93415f'], [.76, '#d96a5e'], [.9, '#ffa766'], [1, '#ffd49a']].forEach(([s, c]) => gr.addColorStop(s, c));
  g.fillStyle = gr; g.fillRect(0, 0, W, HOR + 30);
  g.save(); g.globalCompositeOperation = 'lighter'; glow(g, SUN.x, SUN.y, 640, 'rgba(255,140,90,A)', .42); glow(g, SUN.x, SUN.y, 300, 'rgba(255,200,130,A)', .55); g.restore();

/* ---------- disparo del jugador ---------- */
function hitscan(tx, ty) {
  // 1) balas enemigas grandes
  for (const b of ebul) if (b.kind === 'b' && b.t > 0.35 && Math.hypot(b.x - tx, b.y - ty) < 12 + b.t * 14) {
    b.dead = true; sparks(b.x, b.y, 6, '#ff9a52'); score += 10; sfx.hit(); return true; }
  // 2) pickups
  for (const k of pickups) if (Math.abs(k.x - tx) < 34 && Math.abs(k.y - 20 - ty) < 34) { collect(k); return true; }
  // 3) enemigos (los más cercanos primero)
  const list = enemies.filter(e => !e.dying).sort((a, b) => b.z - a.z);
  for (const e of list) {
    const b = boxOf(e);
    if (tx > b.x - b.w / 2 && tx < b.x + b.w / 2 && ty > b.y - b.h && ty < b.y) {
      const head = ty < b.y - b.h * 0.78;
      damageEnemy(e, head ? 2 : 1, tx, ty, head); return true;
    }
  }
  // 4) cajas
  for (const c of crates) {
    const s = zscale(c.z) * 80, y = zy(c.z);
    if (Math.abs(c.x - tx) < s * 0.7 && ty > y - s && ty < y) {
      c.hp--; c.hit = 0.1; sparks(tx, ty, 5, '#e8c070'); sfx.hit();
      if (c.hp <= 0) { c.dead = true; debris(c.x, y - s / 2, 14, '#8a6a3a'); puff(c.x, y - s / 2, 6); dropPickup(c.x, y, true); sfx.boom(); shakeT = 0.15; }
      return true; }
  }
  return false;
}
function damageEnemy(e, dmg, x, y, head) {

  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e, silent) {
  if (e.dying) return; e.dying = true; e.dt = 0;
  const T = TYPES[e.type], b = boxOf(e);
  if (!silent) {

  }

  if (e.type === 'boss') { explosion(b.x, b.y - b.h / 2, 2.4); queue = queue.filter(t => t !== 'boss'); }
  else shakeT = Math.max(shakeT, 0.08);
}

/* ---------- ataques enemigos ---------- */
function enemyAttack(e) {
  const b = boxOf(e), sx = b.x, sy = b.y - b.h * 0.62;
  const aimAt = (spread = 26) => ({ tx: P.x + P.vx * Math.min(0.5, 0.1 + wave * 0.03) + rnd(-spread, spread), ty: P.y - 50 + rnd(-spread, spread) * 0.5 });
  const bullet = (spread, dur) => { const a = aimAt(spread); ebul.push({ kind: 'b', sx, sy, tx: a.tx, ty: a.ty, t: 0, dur: dur || rnd(0.95, 1.35), z: e.z, x: sx, y: sy, px: sx, py: sy, dmg: e.type === 'heavy' ? 12 : 8 }); };
  const nade = (spread) => { const a = aimAt(spread); ebul.push({ kind: 'g', own: 'e', sx, sy, tx: a.tx, ty: clamp(P.y + rnd(-30, 20), 560, 690), t: 0, dur: 1.6, x: sx, y: sy, rx: 130, ry: 46 }); };

  else if (e.type === 'grenadier') { nade(40); sfx.enemy(); }

    shakeT = Math.max(shakeT, 0.12); sfx.enemy();

  for (let i = 0; i < 4; i++) addPart({ k: 'f', x: sx, y: sy, vx: rnd(-30, 30), vy: rnd(-30, 30), life: 0.12, max: 0.12, sz: 16 * zscale(e.z) * e.size, g: 0 });
}

}

/* ---------- actualización ---------- */
function update(dt) {
  time += dt;
  if (state === 'menu' || state === 'pause') return;
  // timers
  comboT -= dt; if (comboT <= 0) streak = 0;
  flashT = Math.max(0, flashT - dt); shakeT = Math.max(0, shakeT - dt); hurtT = Math.max(0, hurtT - dt);
  bannerT = Math.max(0, bannerT - dt);
  if (P.wt > 0) { P.wt -= dt; if (P.wt <= 0) P.weapon = 'mg'; }

  // jugador
  if (state === 'play') {
    const ax = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    const ay = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    if (ax) P.dir = ax;
    P.inv = Math.max(0, P.inv - dt); P.rollCd -= dt; P.fireCd -= dt; P.flash -= dt;
    if (P.roll > 0) { P.roll -= dt; P.vx = P.rd.x * 880; P.vy = P.rd.y * 520; }
    else {
      const l = Math.hypot(ax, ay) || 1;
      P.vx = lerp(P.vx, ax / l * 380, Math.min(1, dt * 14)); P.vy = lerp(P.vy, ay / l * 260, Math.min(1, dt * 14));
      if (keys.Space && P.rollCd <= 0) {
        P.roll = 0.36; P.rollCd = 0.95; P.inv = Math.max(P.inv, 0.36); sfx.roll();
        P.rd = (ax || ay) ? { x: ax / l, y: ay / l } : { x: P.dir, y: 0 };
      }
    }
    P.x = clamp(P.x + P.vx * dt, 70, W - 70); P.y = clamp(P.y + P.vy * dt, 540, 682);
    if (mouse.down && P.fireCd <= 0 && P.roll <= 0) shoot();
  }

  // oleadas
  if (state === 'play') {
    const alive = enemies.filter(e => !e.dying).length;
    if (queue.length === 0 && alive === 0 && bannerT <= 0) {
      waveDelay -= dt;
      if (waveDelay <= 0) {
        if (wave > 0) { score += wave * 250; P.hp = Math.min(P.max, P.hp + 15); P.gren = Math.min(9, P.gren + 1); }
        startWave(wave + 1); waveDelay = 2.2;
      }
    } else if (queue.length) {
      spawnT -= dt;
      if (spawnT <= 0 && alive < 4 + Math.floor(wave / 2) + (queue[0] === 'boss' ? 0 : 0)) {
        spawn(queue.shift()); spawnT = Math.max(0.5, 1.6 - wave * 0.08);
      }
    }
  }

  // enemigos
  for (const e of enemies) {
    e.anim += dt; e.flash -= dt;
    if (e.dying) { e.dt += dt; continue; }
    const T = TYPES[e.type]; e.moving = false;
    if (e.type === 'runner') {
      e.z += dt * T.spd; e.x += (P.x - e.x) * dt * 0.9; e.moving = true;
      if (e.z >= 0.97) { hurtPlayer(20); killEnemy(e, true); explosion(e.x, zy(e.z) - 30, 0.6); }
      continue;
    }
    if (e.z < e.tz) { e.z += dt * T.spd; e.moving = true; }
    e.x = clamp(e.x + Math.sin(e.anim * T.sw + e.ph) * T.sa * dt, 90, W - 90);
    e.cd -= dt;
    if (e.aim > 0) { e.aim -= dt; if (e.aim <= 0) enemyAttack(e); }
    else if (e.cd <= 0 && e.z >= e.tz - 0.05) { e.aim = T.tele; e.cd = rnd(T.cd[0], T.cd[1]); }
  }
  enemies = enemies.filter(e => !(e.dying && e.dt > 0.7));

  // proyectiles enemigos y granadas
  for (const b of ebul) {
    b.t += dt / b.dur;
    if (b.kind === 'b') {
      b.px = b.x; b.py = b.y; b.x = lerp(b.sx, b.tx, b.t); b.y = lerp(b.sy, b.ty, b.t);
      if (b.t > 0.12) for (const br of barricades) {
        if (br.hp > 0 && b.z < 0.88 && b.x > br.x - br.w / 2 && b.x < br.x + br.w / 2 && b.y > br.base - br.h && b.y < br.base) {
          br.hp--; br.hit = 0.1; b.dead = true; sparks(b.x, b.y, 7, '#ffcf8a'); debris(b.x, b.y, 3, '#7a7068'); sfx.hit();
          if (br.hp <= 0) { debris(br.x, br.base - 30, 22, '#7a7068'); puff(br.x, br.base - 30, 10); sfx.boom(); shakeT = 0.2; }
          break; }
      }
      if (!b.dead && b.t >= 1) {
        b.dead = true;
        if (Math.hypot(b.tx - P.x, b.ty - (P.y - 50)) < 62) hurtPlayer(b.dmg); else puff(b.tx, b.ty, 2, 'rgba(120,100,90,A)', 14);
      }
    } else {
      const ease = b.t; b.x = lerp(b.sx, b.tx, ease); b.y = lerp(b.sy, b.ty, ease) - Math.sin(Math.PI * Math.min(1, ease)) * (b.own === 'p' ? 110 : 160);
      if (b.t >= 1) {
        b.dead = true; explosion(b.tx, b.ty, b.own === 'p' ? 1.1 : 0.9);
        if (b.own === 'p') {
          for (const e of enemies) { if (e.dying) continue; const bx = boxOf(e), d = Math.hypot(e.x - b.tx, bx.y - bx.h / 2 - b.ty);
            if (d < b.rx + bx.w * 0.4) damageEnemy(e, e.type === 'boss' ? 12 : 8, e.x, bx.y - bx.h / 2, false); }
          for (const o of ebul) if (o.kind === 'b' && Math.hypot(o.x - b.tx, o.y - b.ty) < b.rx) o.dead = true;
          for (const c of crates) if (Math.hypot(c.x - b.tx, zy(c.z) - b.ty) < b.rx) { c.hp = 0; c.dead = true; debris(c.x, zy(c.z) - 30, 14, '#8a6a3a'); dropPickup(c.x, zy(c.z), true); }
        } else {
          const dx = (P.x - b.tx) / b.rx, dy = (P.y - b.ty) / b.ry; if (dx * dx + dy * dy < 1) hurtPlayer(25);
          for (const br of barricades) if (br.hp > 0 && Math.abs(br.x - b.tx) < b.rx + br.w / 2 && Math.abs(br.base - b.ty) < 90) { br.hp -= 5; br.hit = 0.15; if (br.hp <= 0) debris(br.x, br.base - 30, 22, '#7a7068'); }
        }
      }
    }
  }
  ebul = ebul.filter(b => !b.dead);

  barricades.forEach(b => b.hit = Math.max(0, b.hit - dt));
  crates.forEach(c => c.hit = Math.max(0, c.hit - dt));
  crates = crates.filter(c => !c.dead);
  barricades = barricades.filter(b => b.hp > 0 || b.keep);
  pickups.forEach(k => { k.life -= dt; k.t += dt; }); pickups = pickups.filter(k => !k.dead && k.life > 0);
  tracers.forEach(t => t.life -= dt); tracers = tracers.filter(t => t.life > 0);
  floaters.forEach(f => { f.life -= dt; f.y -= 40 * dt; }); floaters = floaters.filter(f => f.life > 0);
  for (const p of parts) { p.life -= dt; p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt; p.vy += (p.g || 0) * dt; if (p.rot !== undefined) p.rot += p.vr * dt; }
  parts = parts.filter(p => p.life > 0);
}

  if (bannerT > 0) { g.globalAlpha = clamp(bannerT, 0, 1); text(g, bannerText, W / 2, 200, 64, '#ffd36b', 'center', 900); g.globalAlpha = 1; }
}
function drawCrosshair(g) {
  const x = mouse.x, y = mouse.y, gap = 10 + (P.flash > 0 ? 6 : 0), col = state === 'play' ? '#7fffd4' : '#fff';
  g.save(); g.strokeStyle = col; g.lineWidth = 2.5; g.lineCap = 'round'; g.shadowColor = col; g.shadowBlur = 8;
  g.beginPath(); g.arc(x, y, 18, 0, 7); g.stroke();
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { g.beginPath(); g.moveTo(x + dx * gap, y + dy * gap); g.lineTo(x + dx * (gap + 14), y + dy * (gap + 14)); g.stroke(); }
  g.fillStyle = '#ff4d4d'; g.beginPath(); g.arc(x, y, 2.5, 0, 7); g.fill(); g.restore();
}
function overlayScreens(g) {
  if (state === 'menu') {
    g.fillStyle = 'rgba(5,6,12,.55)'; g.fillRect(0, 0, W, H);
    const t = Math.sin(time * 2) * 6;
    text(g, 'CABAL', W / 2, 200 + t, 140, '#ffb347', 'center', 900);
    text(g, 'H D', W / 2, 270 + t, 54, '#ff5a3a', 'center', 900);
    text(g, 'Resistí las oleadas, usá las barricadas y volá a los jefes.', W / 2, 340, 22, '#dfe6f0', 'center', 600);
    const lines = ['WASD / Flechas  ·  Moverte', 'Mouse  ·  Apuntar          Click  ·  Disparar', 'Click derecho / G  ·  Granada          Espacio  ·  Esquivar (invulnerable)', 'Disparale a las balas grandes para destruirlas  ·  Tiros a la cabeza = x2', 'P  ·  Pausa'];
    lines.forEach((l, i) => text(g, l, W / 2, 400 + i * 32, 19, '#b9c6d8', 'center', 600));
    if (Math.floor(time * 2) % 2) text(g, 'HACÉ CLICK PARA EMPEZAR', W / 2, 620, 34, '#fff', 'center', 800);
  } else if (state === 'pause') {
    g.fillStyle = 'rgba(5,6,12,.6)'; g.fillRect(0, 0, W, H); text(g, 'PAUSA', W / 2, H / 2, 80, '#fff', 'center', 900); text(g, 'P para continuar', W / 2, H / 2 + 50, 22, '#bcd');
  } else if (state === 'over') {
    g.fillStyle = 'rgba(20,0,0,.55)'; g.fillRect(0, 0, W, H);
    text(g, 'GAME OVER', W / 2, 270, 110, '#ff5a4d', 'center', 900);
    text(g, 'Puntaje ' + score + '   ·   Oleada ' + wave, W / 2, 340, 32, '#fff', 'center', 700);
    text(g, score >= hiscore && score > 0 ? '¡NUEVO RÉCORD!' : 'Récord ' + hiscore, W / 2, 385, 24, '#ffd36b', 'center', 800);
    if (Math.floor(time * 2) % 2) text(g, 'CLICK o ENTER para reintentar', W / 2, 470, 30, '#fff', 'center', 800);
  }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, ox * dpr, oy * dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.save();
  if (shakeT > 0) ctx.translate(rnd(-1, 1) * shakeT * 22, rnd(-1, 1) * shakeT * 22);
  drawWorld(ctx);
  ctx.restore();
  if (flashT > 0) { ctx.fillStyle = `rgba(255,230,190,${flashT * 1.4})`; ctx.fillRect(0, 0, W, H); }
  ctx.drawImage(vignette, 0, 0);
  if (hurtT > 0) { const gr = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.7); gr.addColorStop(0, 'rgba(255,0,0,0)'); gr.addColorStop(1, `rgba(255,0,0,${hurtT * 1.1})`); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }
  if (state !== 'menu') drawHUD(ctx);
  overlayScreens(ctx);
  drawCrosshair(ctx);
  ctx.restore();
}

/* ---------- entrada ---------- */
function toLogical(e) { mouse.x = clamp((e.clientX - ox) / scale, 0, W); mouse.y = clamp((e.clientY - oy) / scale, 0, H); }
addEventListener('mousemove', toLogical);
addEventListener('mousedown', e => {
  toLogical(e); initAudio();
  if (state === 'menu') { resetGame(); state = 'play'; return; }
  if (state === 'over') { resetGame(); state = 'play'; return; }
  if (e.button === 0) mouse.down = true; if (e.button === 2) throwGrenade();
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { mouse.down = false; if (state === 'play') state = 'pause'; });
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true; initAudio();
  if (e.code === 'KeyG') throwGrenade();
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
  if ((e.code === 'Enter') && (state === 'over' || state === 'menu')) { resetGame(); state = 'play'; }
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* ---------- bucle ---------- */
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// hooks para pruebas automáticas
window.__cabal = { renderSoldier, drawBackground, drawForeground, drawSoldier, drawBoss, drawBarricade, drawCrate, drawPickup, drawPlayer, bg, PAL, mouse, P, spawn, startWave, enemyAttack, get state() { return state; }, get enemies() { return enemies; }, get wave() { return wave; }, get score() { return score; } };
})();
</script>
